    <!-- PWA: faz o app virar icone na tela inicial, no Android e no iPhone -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <meta name="theme-color" content="#0B1E3D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EduSync" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* 100dvh = altura REAL visivel no celular. Ela encolhe e cresce junto
           com a barra do navegador, diferente do 100% / 100vh, que contam a
           tela inteira e deixam o rodape do app embaixo da barra do Safari.
           Navegador que nao conhece dvh simplesmente ignora esta linha e fica
           com o 100% de cima. */
        height: 100dvh;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* impede o efeito elastico de puxar a pagina inteira no iPhone */
        overscroll-behavior-y: none;
      }
      html,
      body {
        /* A faixa do relogio e da bateria, no app instalado, recebe a cor de
           fundo DA PAGINA -- nao a do theme-color, que o Safari ignora para
           isso. Sem esta linha o body fica branco, que e o padrao do
           navegador, e sobra aquela faixa branca em cima do cabecalho azul.
           Com o marinho aqui, a barra de status vira continuacao do
           cabecalho. Tambem e a cor que aparece em qualquer sobra de
           rolagem. */
        background-color: #0b1e3d;
      }
      html,
      body {
        /* "pan-x pan-y" = rolar com um dedo continua normal, mas a pinca e o
           toque duplo nao ampliam mais a pagina. E o que faz o PWA parecer
           app em vez de site: ele se ajusta a tela, e a pessoa nao consegue
           deixar o layout de tamanho errado sem querer. */
        touch-action: pan-x pan-y;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        height: 100dvh;
        flex: 1;
      }
    </style>

    <style id="splash-edusync-estilo">
      /* Tela de abertura escrita direto no HTML.
         O iOS nao mostra splash em PWA: ele so aceita apple-touch-startup-image,
         uma imagem exata por modelo de iPhone, e qualquer tamanho que falte vira
         tela branca. Como isto aqui esta no proprio HTML, ele aparece assim que
         a pagina chega, antes do JavaScript carregar, em qualquer aparelho. */
      #splash-edusync {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0B1E3D;
        transition: opacity 0.35s ease;
      }
      #splash-edusync.sumindo {
        opacity: 0;
        pointer-events: none;
      }
      #splash-edusync img {
        width: 112px;
        height: 112px;
        animation: splash-pulsa 1.6s ease-in-out infinite;
      }
      /* Pulso discreto: sem ele a tela parece travada numa conexao lenta. */
      @keyframes splash-pulsa {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash-edusync img { animation: none; }
      }
    </style>
  </head>

    <script>
      // Trava do zoom no iPhone.
      //
      // O meta viewport la em cima ja pede isso, mas o Safari ignora o
      // user-scalable=no numa aba comum (foi uma decisao da Apple, por
      // acessibilidade). Estes tres eventos sao o jeito do WebKit avisar que
      // uma pinca comecou; cancelando eles, a pagina nao amplia nem no
      // Safari nem no app instalado.
      //
      // Rolar com um dedo nao passa por aqui, entao continua funcionando.
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (nome) {
        document.addEventListener(
          nome,
          function (evento) {
            evento.preventDefault();
          },
          { passive: false }
        );
      });
    </script>

    <script>
      (function () {
        var splash = document.getElementById('splash-edusync');
        var raiz = document.getElementById('root');
        if (!splash || !raiz) return;

        var jaSaiu = false;
        function sair() {
          if (jaSaiu) return;
          jaSaiu = true;
          splash.classList.add('sumindo');
          setTimeout(function () {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
          }, 400);
        }

        // Se o app ja montou antes deste script rodar, sai na hora.
        if (raiz.childElementCount > 0) {
          sair();
          return;
        }

        // Fica de olho no #root: o React coloca o primeiro filho ali quando
        // termina de montar. E esse o momento de tirar a tela de abertura.
        var observador = new MutationObserver(function () {
          if (raiz.childElementCount > 0) {
            observador.disconnect();
            sair();
          }
        });
        observador.observe(raiz, { childList: true });

        // Rede de seguranca: se algo quebrar no carregamento, a pessoa nao pode
        // ficar presa na tela de abertura para sempre.
        setTimeout(sair, 15000);
      })();
    </script>
